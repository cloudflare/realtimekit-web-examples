name: Deploy React Examples (Staging)

permissions:
  contents: read

on:
  push:
    branches:
      - staging
    paths:
      - 'react-examples/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy React Examples (Staging)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./

      - name: Debug env vars
        run: |
          echo "VITE_BASE_URL_STAGING is set: ${{ secrets.VITE_BASE_URL_STAGING != '' }}"
          echo "VITE_BASE_URL_STAGING value: $VITE_BASE_URL"
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL_STAGING }}

      - name: Build
        run: pnpm run build --env staging
        working-directory: ./react-examples
        env:
          CLOUDFLARE_ENV: staging
          VITE_ENV: staging
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL_STAGING }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.42.1'
          command: deploy --env staging
          workingDirectory: ./react-examples